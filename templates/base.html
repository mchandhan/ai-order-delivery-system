<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AI-powered order management and tracking system with natural language chat interface." />
  <title>{% block title %}OrderMind AI{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=2" />
</head>
<body>

  <!-- ── Navigation ─────────────────────────────────────────────────── -->
  <nav class="navbar" id="navbar">
    <div class="nav-brand">
      <span class="brand-icon">⚡</span>
      <span class="brand-name">OrderMind <span class="brand-ai">AI</span></span>
    </div>
    <div class="nav-links">
      <a href="/chat"   class="nav-link {% if request.path == '/chat' %}active{% endif %}" id="nav-chat">
        <span class="nav-icon">💬</span> Chat
      </a>
      <a href="/orders" class="nav-link {% if request.path == '/orders' %}active{% endif %}" id="nav-dashboard">
        <span class="nav-icon">📊</span> Dashboard
      </a>
    </div>
    <div class="nav-status">
      <span class="status-dot" id="ai-status-dot"></span>
      <span class="status-text" id="ai-status-text">AI Ready</span>
    </div>
  </nav>

  <!-- ── Page Content ────────────────────────────────────────────────── -->
  <main class="main-content">
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='js/app.js') }}?v=2"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
